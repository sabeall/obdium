[package]
name = "obdium"
version = "1.5.0"
edition = "2021"

[dependencies]
serialport = "4.7.1"
xz2 = ">=0.1.7"
sqlite = { version = "0.37.0", features = ["bundled"] }
chrono = "0.4.41"
num_enum = "0.7.3"
thiserror = "2.0.12"
regex = "1.11.1"
evalexpr = "12.0.2"
serde_json = "1.0.140"
serde = { version = "^1.0.190", features = ["derive"] }
tokio = "1.45.0"
rand = "0.9.1"
once_cell = "1.21.3"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Optional BLE (GATT) transport. Only pulled in when the `ble` feature is enabled.
btleplug = { version = "0.11", optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The desktop app ships with BLE support by default (Tauri has no config field for
# cargo features, so this is how packaged/dev app builds pick it up). Consumers that
# want a lean build — e.g. the MCP crate — depend with `default-features = false`.
default = ["ble"]
custom-protocol = ["tauri/custom-protocol"]
# Enable the BLE adapter backend (Veepeak OBDCheck BLE, vLinker, etc.).
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]
